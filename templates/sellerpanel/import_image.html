{% extends "base.html" %}
{% block title %}Rasmni import qilish - Vega Market{% endblock %}
{% block content %}
<h1 class="section-title">"{{ product.name }}" uchun rasmni URL orqali import qilish</h1>
<form method="post" class="card form-narrow">
  {% csrf_token %}
  <div class="form-field">
    <label>Rasm manzili (URL)</label>
    <input type="text" name="image_url" placeholder="https://cdn.example.com/image.jpg" required>
  </div>
  <button class="btn btn-primary" type="submit">Import qilish</button>
</form>
{% if fetched_preview %}
<div class="card" style="margin-top:16px;">
  <h3>Server javobi (preview)</h3>
  <pre style="white-space:pre-wrap; word-break:break-all;">{{ fetched_preview }}</pre>
</div>
{% endif %}
{% endblock %}
