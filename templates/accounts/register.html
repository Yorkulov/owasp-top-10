{% extends "base.html" %}
{% block title %}Ro'yxatdan o'tish - Vega Market{% endblock %}
{% block content %}
<div class="card form-narrow">
  <h1 class="section-title" style="margin-top:0;">Ro'yxatdan o'tish</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-field">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p style="color:var(--danger); font-size:.8rem;">{{ field.errors|striptags }}</p>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit" style="width:100%;">Ro'yxatdan o'tish</button>
  </form>
</div>
{% endblock %}
